<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0f0f11; --surface:#18181c; --surface2:#212127;
    --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.16);
    --text:#f0eff4; --muted:#888; --muted2:#555;
    --accent:#7c6af7; --accent2:#a99fff;
    --radius:10px; --radius-sm:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem 5rem;}
  .container{max-width:900px;margin:0 auto;}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem;flex-wrap:wrap;gap:1rem;}
  .logo{font-size:1.4rem;font-weight:600;letter-spacing:-0.02em;}
  .logo span{color:var(--accent2);}
  .today-badge{font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--muted);background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:4px 14px;}

  /* Main tabs */
  .tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:4px;margin-bottom:1.5rem;width:fit-content;flex-wrap:wrap;}
  .tab{padding:6px 18px;border-radius:var(--radius-sm);font-size:0.82rem;cursor:pointer;color:var(--muted);border:none;background:none;font-family:'DM Sans',sans-serif;transition:all .15s;}
  .tab.active{background:var(--surface2);color:var(--text);border:1px solid var(--border2);}

  .panel{display:none;} .panel.active{display:block;}

  /* ── TODAY ── */
  .progress-label{font-size:0.75rem;color:var(--muted);margin-bottom:6px;}
  .progress-bar-wrap{height:6px;background:var(--surface2);border-radius:3px;margin-bottom:1.5rem;overflow:hidden;}
  .progress-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease;}
  .task-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1.5rem;}
  .task-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 16px;cursor:pointer;transition:border-color .15s;user-select:none;}
  .task-row:hover{border-color:rgba(255,255,255,.24);}
  .task-row.done-row{opacity:.45;}
  .task-row.done-row .task-name{text-decoration:line-through;}
  .task-check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;transition:all .15s;}
  .task-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .task-info{flex:1;min-width:0;}
  .task-name{font-size:.9rem;font-weight:500;margin-bottom:2px;}
  .task-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .task-time{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);}
  .task-tag{font-size:.7rem;color:var(--muted2);background:var(--surface2);border-radius:4px;padding:1px 6px;}

  /* ── CALENDAR sub-tabs ── */
  .cal-sub-tabs{display:flex;gap:4px;margin-bottom:1.25rem;flex-wrap:wrap;}
  .cal-sub-tab{padding:5px 14px;border-radius:20px;font-size:0.78rem;cursor:pointer;color:var(--muted);border:1px solid var(--border2);background:none;font-family:'DM Sans',sans-serif;transition:all .15s;}
  .cal-sub-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* ── Cal nav ── */
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px;}
  .month-nav{display:flex;align-items:center;gap:8px;}
  .month-label{font-family:'DM Mono',monospace;font-size:.85rem;color:var(--muted);min-width:130px;text-align:center;}
  .icon-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);width:32px;height:32px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .icon-btn:hover{background:var(--border2);}

  /* ── Stats ── */
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
  .stat-name{font-size:.7rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
  .stat-pct{font-size:1.5rem;font-weight:600;}
  .stat-sub{font-size:.7rem;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace;}
  .stat-streak{font-size:.7rem;color:var(--accent2);margin-top:3px;}

  /* ── Monthly cal ── */
  .cal-wrap{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  thead th{font-size:.7rem;color:var(--muted);font-weight:400;text-transform:uppercase;letter-spacing:.07em;padding:10px 0;text-align:center;border-bottom:1px solid var(--border);}
  .day-cell{border:1px solid var(--border);padding:6px;vertical-align:top;min-height:82px;width:calc(100%/7);background:var(--bg);transition:background .1s;}
  .day-cell:hover{background:var(--surface2);}
  .day-cell.empty{background:var(--surface);border-color:transparent;}
  .day-num{font-size:.7rem;color:var(--muted);width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:4px;font-family:'DM Mono',monospace;}
  .day-cell.today .day-num{background:var(--accent);color:#fff;}
  .dots{display:flex;flex-wrap:wrap;gap:3px;}
  .hdot{width:13px;height:13px;border-radius:3px;cursor:pointer;transition:opacity .15s,transform .1s;}
  .hdot:hover{transform:scale(1.2);}
  .hdot.on{opacity:1;} .hdot.off{opacity:.13;}

  /* ── Weekly view ── */
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:1rem;}
  .week-day-col{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;}
  .week-day-head{text-align:center;padding:8px 4px 6px;border-bottom:1px solid var(--border);}
  .week-day-name{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .week-day-num{font-size:1rem;font-weight:500;margin-top:2px;}
  .week-day-num.today-num{color:var(--accent);}
  .week-habits{padding:8px 6px;display:flex;flex-direction:column;gap:5px;}
  .week-hdot{width:100%;height:12px;border-radius:3px;cursor:pointer;transition:opacity .15s;}
  .week-hdot.on{opacity:1;} .week-hdot.off{opacity:.13;}
  .week-hdot:hover{opacity:.7;}

  /* ── Multi-month heatmap (3m / 6m) ── */
  .heatmap-section{margin-bottom:2rem;}
  .heatmap-month-label{font-size:.78rem;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:6px;padding-left:2px;}
  .heatmap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:14px;}
  .hm-cell{aspect-ratio:1;border-radius:4px;cursor:pointer;position:relative;transition:transform .1s;}
  .hm-cell:hover{transform:scale(1.15);z-index:1;}
  .hm-cell .tooltip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#1a1a1f;border:1px solid var(--border2);border-radius:6px;padding:4px 8px;font-size:.68rem;white-space:nowrap;z-index:10;pointer-events:none;color:var(--text);}
  .hm-cell:hover .tooltip{display:block;}
  .hm-day-label{font-size:.6rem;color:var(--muted2);text-align:center;padding:1px 0;}

  /* habit heatmap row */
  .habit-heatmap{margin-bottom:1.5rem;}
  .habit-hm-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .habit-hm-dot{width:10px;height:10px;border-radius:50%;}
  .habit-hm-name{font-size:.82rem;font-weight:500;}
  .habit-hm-streak{font-size:.72rem;color:var(--accent2);margin-left:auto;}
  .hm-row{display:flex;gap:3px;flex-wrap:wrap;}
  .hm-sq{width:14px;height:14px;border-radius:3px;cursor:pointer;flex-shrink:0;transition:transform .1s;}
  .hm-sq:hover{transform:scale(1.2);}

  /* ── Legend ── */
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:1rem;}
  .leg{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);}
  .leg-dot{width:10px;height:10px;border-radius:2px;}

  /* ── Habits panel ── */
  .habits-mgmt{display:flex;flex-direction:column;gap:10px;}
  .habit-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .habit-card-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .habit-card-info{flex:1;min-width:100px;}
  .habit-card-name{font-size:.9rem;font-weight:500;}
  .habit-card-meta{font-size:.75rem;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace;}
  .small-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--muted);padding:4px 10px;font-size:.75rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
  .small-btn.danger:hover{color:#f87171;border-color:#f87171;}

  .add-btn{background:var(--accent);border:none;border-radius:var(--radius-sm);color:#fff;padding:0 16px;height:34px;cursor:pointer;font-size:.82rem;font-family:'DM Sans',sans-serif;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s;}
  .add-btn:hover{opacity:.85;}
  .add-form{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:1.25rem;margin-top:1rem;display:none;}
  .add-form.open{display:block;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .form-group label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px;}
  .form-group input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:8px 12px;font-size:.85rem;font-family:'DM Sans',sans-serif;outline:none;}
  .form-group input:focus{border-color:var(--accent);}
  .color-row{display:flex;gap:6px;flex-wrap:wrap;}
  .cpick{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .1s;}
  .cpick:hover{transform:scale(1.15);} .cpick.sel{border-color:#fff;}
  .form-footer{display:flex;gap:8px;margin-top:14px;}
  .form-save{background:var(--accent);border:none;border-radius:var(--radius-sm);color:#fff;padding:8px 20px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;}
  .form-cancel{background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--muted);padding:8px 16px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.85rem;}

  @media(max-width:540px){
    .form-grid{grid-template-columns:1fr;}
    .day-cell{padding:3px;min-height:56px;}
    .hdot{width:10px;height:10px;}
    .day-num{font-size:.6rem;width:18px;height:18px;}
    .week-grid{grid-template-columns:repeat(7,1fr);gap:3px;}
    .week-day-num{font-size:.85rem;}
    .hm-sq{width:11px;height:11px;}
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">habit<span>.</span>tracker</div>
    <div class="today-badge" id="todayBadge"></div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('today')">Today</button>
    <button class="tab" onclick="switchTab('calendar')">Calendar</button>
    <button class="tab" onclick="switchTab('habits')">Manage Habits</button>
  </div>

  <!-- TODAY -->
  <div class="panel active" id="panel-today">
    <div class="progress-label" id="progressLabel"></div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    <div class="task-list" id="taskList"></div>
    <div style="color:var(--muted);font-size:.78rem">Tap to mark done · Add habits in Manage Habits tab</div>
  </div>

  <!-- CALENDAR -->
  <div class="panel" id="panel-calendar">
    <!-- sub tabs -->
    <div class="cal-sub-tabs">
      <button class="cal-sub-tab active" onclick="switchCalView('weekly')">Week</button>
      <button class="cal-sub-tab" onclick="switchCalView('monthly')">Month</button>
      <button class="cal-sub-tab" onclick="switchCalView('3month')">3 Months</button>
      <button class="cal-sub-tab" onclick="switchCalView('6month')">6 Months</button>
    </div>

    <div class="cal-top">
      <div class="month-nav">
        <button class="icon-btn" onclick="calNav(-1)">&#8249;</button>
        <span class="month-label" id="monthLabel"></span>
        <button class="icon-btn" onclick="calNav(1)">&#8250;</button>
      </div>
    </div>

    <div class="stats" id="statsRow"></div>
    <div id="calContent"></div>
    <div class="legend" id="legend"></div>
  </div>

  <!-- HABITS -->
  <div class="panel" id="panel-habits">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:8px;">
      <div style="font-size:.85rem;color:var(--muted)">Set a time &amp; order for each habit.</div>
      <button class="add-btn" onclick="toggleAddForm()">+ Add habit</button>
    </div>
    <div class="add-form" id="addForm">
      <div class="form-grid">
        <div class="form-group"><label>Habit name</label><input type="text" id="fName" placeholder="e.g. Gym, Walk, Water..." maxlength="30"/></div>
        <div class="form-group"><label>Time of day</label><input type="time" id="fTime" value="07:00"/></div>
        <div class="form-group"><label>Note / category</label><input type="text" id="fNote" placeholder="e.g. Morning routine" maxlength="40"/></div>
        <div class="form-group"><label>Order (1 = first)</label><input type="number" id="fOrder" min="1" max="99" value="1"/></div>
      </div>
      <div class="form-group"><label>Color</label><div class="color-row" id="colorRow" style="margin-top:6px"></div></div>
      <div class="form-footer">
        <button class="form-save" onclick="addHabit()">Save habit</button>
        <button class="form-cancel" onclick="toggleAddForm()">Cancel</button>
      </div>
    </div>
    <div class="habits-mgmt" id="habitsMgmt"></div>
  </div>

</div>
<script>
const COLORS=['#7c6af7','#22c9a0','#f97316','#e94f84','#3b9eff','#f5c842','#a3e635','#f87171','#c084fc','#38bdf8'];
const MONTHS_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

let selColor=COLORS[0];
const DEFAULT_HABITS=[
  {id:'gym',  name:'Gym',         color:'#7c6af7',time:'06:30',note:'Morning workout',order:1},
  {id:'walk', name:'Morning Walk',color:'#22c9a0',time:'07:15',note:'30 min walk',    order:2},
  {id:'water',name:'Water 8 cups',color:'#3b9eff',time:'08:00',note:'Stay hydrated',  order:3},
  {id:'read', name:'Reading',     color:'#f5c842',time:'21:00',note:'Before bed',     order:4},
];
let habits=JSON.parse(localStorage.getItem('ht4_habits')||'null')||DEFAULT_HABITS;
let done  =JSON.parse(localStorage.getItem('ht4_done')||'{}');

const NOW=new Date();
let curYear=NOW.getFullYear(), curMonth=NOW.getMonth();
let calView='weekly'; // weekly | monthly | 3month | 6month

function save(){
  localStorage.setItem('ht4_habits',JSON.stringify(habits));
  localStorage.setItem('ht4_done',JSON.stringify(done));
}
function pad(n){return String(n).padStart(2,'0');}
function dateStr(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`;}
function todayStr(){return dateStr(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());}
function key(hid,ds){return hid+'|'+ds;}
function fmtTime(t){if(!t)return'';const[h,m]=t.split(':').map(Number);return`${h%12||12}:${pad(m)} ${h>=12?'PM':'AM'}`;}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}

// hex color with alpha for heatmap intensity
function hexAlpha(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ─ navigation ─ */
function calNav(d){
  if(calView==='weekly'){
    // move by 7 days
    const ref=new Date(curYear,curMonth,1);
    ref.setDate(ref.getDate()+d*7);
    curYear=ref.getFullYear(); curMonth=ref.getMonth();
  } else if(calView==='monthly'){
    curMonth+=d; if(curMonth>11){curMonth=0;curYear++;}else if(curMonth<0){curMonth=11;curYear--;}
  } else if(calView==='3month'){
    curMonth+=d*3; while(curMonth>11){curMonth-=12;curYear++;}while(curMonth<0){curMonth+=12;curYear--;}
  } else {
    curMonth+=d*6; while(curMonth>11){curMonth-=12;curYear++;}while(curMonth<0){curMonth+=12;curYear--;}
  }
  renderCalendar();
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['today','calendar','habits'][i]===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  render();
}

function switchCalView(v){
  calView=v;
  document.querySelectorAll('.cal-sub-tab').forEach((t,i)=>t.classList.toggle('active',['weekly','monthly','3month','6month'][i]===v));
  renderCalendar();
}

/* ─ streak helper ─ */
function calcStreak(hid){
  let streak=0;
  const d=new Date(NOW);
  while(true){
    const ds=dateStr(d.getFullYear(),d.getMonth(),d.getDate());
    if(done[key(hid,ds)]){streak++;d.setDate(d.getDate()-1);}else break;
  }
  return streak;
}
function calcBestStreak(hid){
  // scan all keys for this habit
  let best=0,cur=0;
  const keys=Object.keys(done).filter(k=>k.startsWith(hid+'|')&&done[k]);
  if(!keys.length)return 0;
  const dates=keys.map(k=>k.split('|')[1]).sort();
  dates.forEach((ds,i)=>{
    if(i===0){cur=1;}else{
      const prev=new Date(dates[i-1]);prev.setDate(prev.getDate()+1);
      const thisD=new Date(ds);
      if(prev.toISOString().slice(0,10)===ds)cur++;else cur=1;
    }
    if(cur>best)best=cur;
  });
  return best;
}

/* ─ TODAY ─ */
function renderToday(){
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('todayBadge').textContent=`${days[NOW.getDay()]}, ${NOW.getDate()} ${MONTHS_SHORT[NOW.getMonth()]} ${NOW.getFullYear()}`;
  const ds=todayStr();
  const sorted=[...habits].sort((a,b)=>(a.order||99)-(b.order||99)||(a.time||'').localeCompare(b.time||''));
  const doneCount=sorted.filter(h=>done[key(h.id,ds)]).length;
  const total=sorted.length;
  const pct=total?Math.round(doneCount/total*100):0;
  document.getElementById('progressLabel').textContent=`${doneCount} of ${total} done — ${pct}%`;
  document.getElementById('progressFill').style.width=pct+'%';
  if(!sorted.length){document.getElementById('taskList').innerHTML='<div style="text-align:center;color:var(--muted);padding:2rem;font-size:.85rem">No habits yet — go to <strong>Manage Habits</strong></div>';return;}
  document.getElementById('taskList').innerHTML=sorted.map((h,i)=>{
    const isDone=!!done[key(h.id,ds)];
    const ck=isDone?`background:${h.color};border-color:${h.color}`:'';
    return `<div class="task-row${isDone?' done-row':''}" onclick="toggleToday('${h.id}')">
      <div class="task-check" style="${ck}">${isDone?'✓':''}</div>
      <div class="task-dot" style="background:${h.color}"></div>
      <div class="task-info">
        <div class="task-name">${h.name}</div>
        <div class="task-meta">
          ${h.time?`<span class="task-time">🕐 ${fmtTime(h.time)}</span>`:''}
          ${h.note?`<span class="task-tag">${h.note}</span>`:''}
          <span style="font-size:.7rem;color:var(--muted2)">#${i+1}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleToday(hid){done[key(hid,todayStr())]=!done[key(hid,todayStr())];save();renderToday();}
function toggleCal(hid,ds){done[key(hid,ds)]=!done[key(hid,ds)];save();renderCalendar();}

/* ─ STATS BAR ─ */
function renderStats(y,m){
  const dim=daysInMonth(y,m);
  const tds=todayStr();
  document.getElementById('statsRow').innerHTML=habits.map(h=>{
    let count=0;
    for(let d=1;d<=dim;d++){if(done[key(h.id,dateStr(y,m,d))])count++;}
    const pct=Math.round(count/dim*100);
    const streak=calcStreak(h.id);
    const best=calcBestStreak(h.id);
    return `<div class="stat">
      <div class="stat-name">${h.name}</div>
      <div class="stat-pct" style="color:${h.color}">${pct}%</div>
      <div class="stat-sub">${count}/${dim} days</div>
      ${streak>0?`<div class="stat-streak">🔥 ${streak} day streak</div>`:''}
      ${best>0?`<div class="stat-streak" style="color:var(--muted)">🏆 Best: ${best}</div>`:''}
    </div>`;
  }).join('');
}

function renderLegend(){
  document.getElementById('legend').innerHTML=habits.map(h=>
    `<div class="leg"><div class="leg-dot" style="background:${h.color}"></div>${h.name}</div>`
  ).join('');
}

/* ─ WEEKLY VIEW ─ */
function renderWeekly(){
  // find start of week containing curYear/curMonth/1 (Monday-based display, Sun start)
  const refDate=new Date(curYear,curMonth,1);
  const dow=refDate.getDay(); // 0=Sun
  const weekStart=new Date(refDate);
  weekStart.setDate(refDate.getDate()-dow);

  const tds=todayStr();
  let html='<div class="week-grid">';
  for(let i=0;i<7;i++){
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
    const ds=dateStr(d.getFullYear(),d.getMonth(),d.getDate());
    const isToday=ds===tds;
    const dNum=d.getDate();
    const dName=DAYS_SHORT[d.getDay()];
    html+=`<div class="week-day-col">
      <div class="week-day-head">
        <div class="week-day-name">${dName}</div>
        <div class="week-day-num${isToday?' today-num':''}">${dNum}</div>
      </div>
      <div class="week-habits">`;
    [...habits].sort((a,b)=>(a.order||99)-(b.order||99)).forEach(h=>{
      const on=!!done[key(h.id,ds)];
      html+=`<div class="week-hdot ${on?'on':'off'}" style="background:${h.color}" onclick="toggleCal('${h.id}','${ds}')" title="${h.name} — ${fmtTime(h.time)||'anytime'}"></div>`;
    });
    html+=`</div></div>`;
  }
  html+='</div>';

  // also show week habit names as legend below
  html+=`<div style="margin-top:8px;font-size:.75rem;color:var(--muted)">Each row = one habit in order. Tap to toggle.</div>`;
  html+=`<div style="margin-top:10px;display:flex;flex-direction:column;gap:4px;">`;
  [...habits].sort((a,b)=>(a.order||99)-(b.order||99)).forEach((h,i)=>{
    html+=`<div style="display:flex;align-items:center;gap:8px;font-size:.78rem">
      <div style="width:12px;height:12px;border-radius:3px;background:${h.color};flex-shrink:0"></div>
      <span style="color:var(--muted2)">#${i+1}</span>
      <span>${h.name}</span>
      ${h.time?`<span style="font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted)">${fmtTime(h.time)}</span>`:''}
    </div>`;
  });
  html+=`</div>`;
  return html;
}

/* ─ MONTHLY VIEW ─ */
function renderMonthly(y,m){
  const dim=daysInMonth(y,m);
  const firstDay=new Date(y,m,1).getDay();
  const tds=todayStr();
  let html=`<div class="cal-wrap"><table><thead><tr>`;
  DAYS_SHORT.forEach(d=>html+=`<th>${d}</th>`);
  html+=`</tr></thead><tbody>`;
  let col=0;html+='<tr>';
  for(let i=0;i<firstDay;i++){html+='<td class="day-cell empty"></td>';col++;}
  for(let d=1;d<=dim;d++){
    const ds=dateStr(y,m,d);const isToday=ds===tds;
    html+=`<td class="day-cell${isToday?' today':''}"><div class="day-num">${d}</div><div class="dots">`;
    [...habits].sort((a,b)=>(a.order||99)-(b.order||99)).forEach(h=>{
      const on=!!done[key(h.id,ds)];
      html+=`<div class="hdot ${on?'on':'off'}" style="background:${h.color}" onclick="toggleCal('${h.id}','${ds}')" title="${h.name}"></div>`;
    });
    html+=`</div></td>`;col++;
    if(col%7===0&&d<dim)html+='</tr><tr>';
  }
  while(col%7!==0){html+='<td class="day-cell empty"></td>';col++;}
  html+='</tr></tbody></table></div>';
  return html;
}

/* ─ MULTI-MONTH HEATMAP ─ */
function renderHeatmap(numMonths){
  // build list of months to show, ending at curYear/curMonth
  const monthList=[];
  for(let i=numMonths-1;i>=0;i--){
    let y=curYear,m=curMonth-i;
    while(m<0){m+=12;y--;}
    monthList.push({y,m});
  }
  const tds=todayStr();
  let html='';
  habits.sort((a,b)=>(a.order||99)-(b.order||99)).forEach(h=>{
    const streak=calcStreak(h.id);
    const best=calcBestStreak(h.id);
    html+=`<div class="habit-heatmap">
      <div class="habit-hm-header">
        <div class="habit-hm-dot" style="background:${h.color}"></div>
        <div class="habit-hm-name">${h.name}</div>
        <div class="habit-hm-streak">${streak>0?`🔥 ${streak} streak`:''}${best>0?` &nbsp;🏆 ${best} best`:''}</div>
      </div>`;
    // For each month, show day squares in a compact row with month label
    monthList.forEach(({y,m})=>{
      const dim=daysInMonth(y,m);
      html+=`<div style="margin-bottom:6px">
        <div style="font-size:.65rem;color:var(--muted2);margin-bottom:3px;font-family:'DM Mono',monospace">${MONTHS_SHORT[m]} ${y}</div>
        <div class="hm-row">`;
      // padding for first day
      const firstDay=new Date(y,m,1).getDay();
      for(let p=0;p<firstDay;p++)html+=`<div style="width:14px;height:14px;flex-shrink:0"></div>`;
      for(let d=1;d<=dim;d++){
        const ds=dateStr(y,m,d);
        const on=!!done[key(h.id,ds)];
        const isToday=ds===tds;
        const bg=on?h.color:hexAlpha(h.color,.08);
        const border=isToday?`outline:2px solid ${h.color};outline-offset:1px;`:'';
        html+=`<div class="hm-sq" style="background:${bg};${border}" onclick="toggleCal('${h.id}','${ds}')" title="${ds}${on?' ✓':''}"></div>`;
      }
      html+=`</div></div>`;
    });
    html+=`</div>`;
  });
  return html||'<div style="color:var(--muted);font-size:.85rem;padding:1rem">No habits yet.</div>';
}

/* ─ CALENDAR MAIN ─ */
function renderCalendar(){
  const navLabels={
    weekly:`Week of ${MONTHS_SHORT[curMonth]} ${new Date(curYear,curMonth,1).getDate()}, ${curYear}`,
    monthly:`${MONTHS_FULL[curMonth]} ${curYear}`,
    '3month':`${MONTHS_SHORT[curMonth]} – ${MONTHS_SHORT[(curMonth+2)%12]} ${curYear}`,
    '6month':`${MONTHS_SHORT[curMonth]} – ${MONTHS_SHORT[(curMonth+5)%12]} ${curYear}`,
  };
  document.getElementById('monthLabel').textContent=navLabels[calView];
  renderStats(curYear,curMonth);
  renderLegend();

  let content='';
  if(calView==='weekly')       content=renderWeekly();
  else if(calView==='monthly') content=renderMonthly(curYear,curMonth);
  else if(calView==='3month')  content=renderHeatmap(3);
  else                         content=renderHeatmap(6);
  document.getElementById('calContent').innerHTML=content;
}

/* ─ HABITS PANEL ─ */
function renderHabits(){
  renderColorRow();
  const sorted=[...habits].sort((a,b)=>(a.order||99)-(b.order||99));
  document.getElementById('habitsMgmt').innerHTML=sorted.length===0
    ?'<div style="color:var(--muted);font-size:.85rem;padding:1rem 0">No habits yet.</div>'
    :sorted.map(h=>`<div class="habit-card">
      <div class="habit-card-dot" style="background:${h.color}"></div>
      <div class="habit-card-info">
        <div class="habit-card-name">${h.name}</div>
        <div class="habit-card-meta">${h.time?'🕐 '+fmtTime(h.time)+'  ':''}${h.note?'· '+h.note:''} · #${h.order||'—'}</div>
      </div>
      <div><button class="small-btn danger" onclick="deleteHabit('${h.id}')">Remove</button></div>
    </div>`).join('');
}

function toggleAddForm(){
  const f=document.getElementById('addForm');f.classList.toggle('open');
  if(f.classList.contains('open')){document.getElementById('fOrder').value=habits.length+1;document.getElementById('fName').focus();}
}
function renderColorRow(){
  document.getElementById('colorRow').innerHTML=COLORS.map(c=>
    `<div class="cpick${c===selColor?' sel':''}" style="background:${c}" onclick="selColor='${c}';renderColorRow()"></div>`
  ).join('');
}
function addHabit(){
  const nm=document.getElementById('fName').value.trim();
  if(!nm){document.getElementById('fName').focus();return;}
  habits.push({id:'h'+Date.now(),name:nm,color:selColor,time:document.getElementById('fTime').value||'',note:document.getElementById('fNote').value.trim(),order:parseInt(document.getElementById('fOrder').value)||habits.length+1});
  document.getElementById('fName').value='';document.getElementById('fNote').value='';
  document.getElementById('addForm').classList.remove('open');
  save();render();
}
function deleteHabit(id){
  if(!confirm('Remove this habit and all its history?'))return;
  habits=habits.filter(h=>h.id!==id);save();render();
}

function render(){
  const tabs=[...document.querySelectorAll('.tab')];
  const idx=tabs.findIndex(t=>t.classList.contains('active'));
  if(idx===0)renderToday();
  else if(idx===1)renderCalendar();
  else renderHabits();
}

// init
renderToday();
renderColorRow();
</script>
</body>
</html>
